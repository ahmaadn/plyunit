[project]
name = "plyunit-workspace"
version = "1.0.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "raylib>=5.5.0.4",
    "plyunit[all]",
    "typing-extensions>=4.16.0",
]

[project.scripts]
plyunit-example = "examples.cli:main"

[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

# Install root scripts and expose monorepo examples/ as a package.
[tool.uv]
package = true

[tool.hatch.build.targets.wheel]
packages = ["examples"]

[tool.uv.workspace]
members = [
    "packages/plyunit",
    "packages/plyunit-native",
    "projects/*",
]

[tool.uv.sources]
plyunit = { workspace = true }
plyunit-native = { workspace = true }

[dependency-groups]
dev = [
    "isort>=8.0.1",
    "pyrefly>=1.1.1",
    "pytest>=9.0.2",
    "pytest-cov>=7.1.0",
    "rich>=15.0.0",
    "ruff>=0.15.17",
]
docs = [
    "mkdocs-material>=9.6.0",
    "mkdocs-static-i18n>=1.3.0",
]

[tool.pytest]
minversion = "9.0"
testpaths = ["**/tests"]
# Include package test helper dirs so sibling modules (e.g. fake_backend) resolve
# when collecting from the monorepo root.
pythonpath = [
    ".",
    "packages/plyunit",
    "packages/plyunit/tests",
    "packages/plyunit/tests/engine/audio",
]

[tool.coverage.run]
branch = false
source = [
    "packages/plyunit/src/plyunit",
]
omit = [
    "*/examples/*",
    "*/benchmarks/*",
    "examples/*",
    "benchmarks/*",
    "*/site-packages/examples/*",
    "*/tests/*",
    "*/__pycache__/*",
    "*/.venv/*",
]

[tool.coverage.report]
omit = [
    "*/examples/*",
    "*/benchmarks/*",
    "examples/*",
    "benchmarks/*",
    "*/site-packages/examples/*",
    "*/tests/*",
]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "\\.\\.\\.",
    "raise NotImplementedError",
]

[tool.ruff]
line-length = 88
target-version = "py312"
exclude = [".venv", "venv", ".env", "build/", "dist/", ".ruff_cache/", "tests", "projects/*/scripts/plyunit/"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "RUF", # ruff-specific rules
]


[tool.ruff.lint.isort]
known-first-party = ["plyunit", "scripts"]
combine-as-imports = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
preview = true

[tool.isort]
profile = "black"
line_length = 88
known_first_party = ["plyunit", "scripts"]
combine_as_imports = true

[tool.pyrefly]
project-includes = [
    "**/*.py*",
    "**/*.ipynb",
]
[tool.pyrefly.errors]
bad-override = false
