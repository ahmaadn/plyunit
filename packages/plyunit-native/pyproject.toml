[project]
name = "plyunit-native"
version = "0.1.0"
description = "Optional C extension for plyunit bulk sprite batching (FR-12)"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "setuptools>=84.0.0",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "plyunit_native" = "python/plyunit_native" }

[tool.setuptools.packages.find]
where = ["python"]
